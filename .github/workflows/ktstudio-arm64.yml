# Personal experimental build recipe. Not a confirmed Minecraft port.
# Save this exact file as .github/workflows/ktstudio-arm64.yml.
# No Minecraft APK, tokens, signing keys or worlds are uploaded by this workflow.
# Adding this file starts a build when GitHub Actions is enabled.

name: KTstudio ARM64 host — experimental build
'on':
  push:
    paths:
    - .github/workflows/ktstudio-arm64.yml
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: ktstudio-arm64-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
    - name: Install build tools and Android SDK components
      run: |2

        set -euo pipefail
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends ninja-build cmake libboost-dev e2fsprogs unzip curl openjdk-17-jdk-headless
        JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
        export JAVA_HOME
        export PATH="$JAVA_HOME/bin:$PATH"
        echo "JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
        echo "$JAVA_HOME/bin" >> "$GITHUB_PATH"
        SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
        SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
        test -x "$SDKMANAGER"
        # SDK/NDK licences are needed for the build. No account token or signing key is used.
        set +o pipefail
        yes | "$SDKMANAGER" --licenses >/dev/null
        license_status=${PIPESTATUS[1]}
        set -o pipefail
        test "$license_status" -eq 0
        "$SDKMANAGER" --list --channel=0 > "$RUNNER_TEMP/sdk-packages.txt"
        NDK_PACKAGE=$(sed -n 's/^ *\(ndk;29\.[0-9.]*\) *|.*/\1/p' "$RUNNER_TEMP/sdk-packages.txt" | sort -Vu | tail -n 1)
        test -n "$NDK_PACKAGE"
        "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0' "$NDK_PACKAGE"
        echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
        echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
        echo "NDK=$SDK_ROOT/ndk/${NDK_PACKAGE#ndk;}" >> "$GITHUB_ENV"
        echo "NDK_HOST=linux-x86_64" >> "$GITHUB_ENV"
    - name: Fetch pinned ZettaBridge source and dependencies
      run: |2

        set -euo pipefail
        mkdir -p "$GITHUB_WORKSPACE/zbsource"
        cd "$GITHUB_WORKSPACE/zbsource"
        git init -q
        git remote add origin https://github.com/ZailoxTT/ZettaBridge.git
        git fetch --depth=1 origin d6066b9b9e61de27041ba6e1f3c499c080c9e2b7
        git checkout --detach FETCH_HEAD
        test "$(git rev-parse HEAD)" = d6066b9b9e61de27041ba6e1f3c499c080c9e2b7
        git submodule update --init --recursive
        git -C third_party/dynarmic apply --check ../patches/dynarmic-0001-thumb32-armv8.patch ../patches/dynarmic-0002-asimd-narrowing.patch
        git -C third_party/dynarmic apply ../patches/dynarmic-0001-thumb32-armv8.patch ../patches/dynarmic-0002-asimd-narrowing.patch
        # Fail closed if an earlier source snapshot without NativeActivity is accidentally used.
        grep -R -q 'ANativeActivity_onCreate' core
    - name: Build the ARM64 translator and the ARM32 guest helpers
      run: |2

        set -euo pipefail
        cd "$GITHUB_WORKSPACE/zbsource"
        mkdir -p build/boost-headers
        ln -sfn /usr/include/boost build/boost-headers/boost
        cmake -S . -B build/android-arm64 -G Ninja \
          -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
          -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-29 \
          -DANDROID_STL=c++_static -DCMAKE_BUILD_TYPE=Release \
          -DZB_BUILD_TESTS=OFF -DBoost_INCLUDE_DIR="$PWD/build/boost-headers"
        cmake --build build/android-arm64 --target zbridge zbproxy --parallel 3
        sh tools/build_guest.sh
        sh tools/extract_sysroot.sh
        sh tools/make_launcher_bundle.sh
    - name: Add automatic embedded-game launch (game itself remains local)
      run: |
        set -euo pipefail
        cd "$GITHUB_WORKSPACE/zbsource"
        cat > "$RUNNER_TEMP/KtStudioActivity.java" <<'KT_JAVA'
        package com.zettabridge.launcher;

        import android.app.Activity;
        import android.app.AlertDialog;
        import android.content.ClipData;
        import android.content.ClipboardManager;
        import android.content.Context;
        import android.content.SharedPreferences;
        import android.net.Uri;
        import android.os.Bundle;
        import android.view.Gravity;
        import android.view.Window;
        import android.view.WindowManager;
        import android.widget.LinearLayout;
        import android.widget.ProgressBar;
        import android.widget.TextView;
        import java.io.File;
        import java.io.FileOutputStream;
        import java.io.InputStream;
        import java.nio.charset.StandardCharsets;
        import java.security.MessageDigest;

        /**
         * Personal, single-game bootstrap on top of ZettaBridge.
         * The owned guest APK is embedded locally AFTER the cloud build. No downloads at run time.
         * ZettaBridge performs ARM32 translation; this class does not convert machine code.
         */
        public final class KtStudioActivity extends Activity {
            private static final String GAME = "com.mojang.minecraftpe";
            private static final String ASSET = "ktstudio/game.apk";
            private static final String HASH_ASSET = "ktstudio/game.sha256";
            private static final Object IMPORT_LOCK = new Object();
            private static final long MAX_GAME_BYTES = 256L * 1024L * 1024L;

            @Override protected void onCreate(Bundle savedState) {
                super.onCreate(savedState);
                requestWindowFeature(Window.FEATURE_NO_TITLE);
                getWindow().addFlags(WindowManager.LayoutParams.FLAG_FULLSCREEN);
                LinearLayout layout = new LinearLayout(this);
                layout.setOrientation(LinearLayout.VERTICAL);
                layout.setGravity(Gravity.CENTER);
                int pad = (int) (24 * getResources().getDisplayMetrics().density);
                layout.setPadding(pad, pad, pad, pad);
                TextView label = new TextView(this);
                label.setText("Minecraft 1.1.5 KTstudio\nПодготовка запуска…");
                label.setTextSize(20);
                label.setGravity(Gravity.CENTER);
                layout.addView(label);
                layout.addView(new ProgressBar(this));
                setContentView(layout);

                new Thread(() -> {
                    try {
                        prepareGame();
                        runOnUiThread(() -> {
                            if (isFinishing() || isDestroyed()) return;
                            try {
                                startActivity(GuestLaunchActivity.intent(this, GAME, false));
                                finish();
                            } catch (Exception e) { showFailure(e); }
                        });
                    } catch (Exception | LinkageError error) {
                        runOnUiThread(() -> showFailure(error));
                    }
                }, "ktstudio-prepare").start();
            }

            private void prepareGame() throws Exception {
                // Serialises imports without changing or deleting any previously saved world data.
                synchronized (IMPORT_LOCK) {
                    final String expected;
                    try (InputStream in = getAssets().open(HASH_ASSET)) {
                        byte[] hash = new byte[128];
                        int used = 0, n;
                        while (used < hash.length && (n = in.read(hash, used, hash.length - used)) != -1) {
                            used += n;
                        }
                        if (used == hash.length && in.read() != -1)
                            throw new IllegalStateException("Invalid bundled game checksum");
                        expected = new String(hash, 0, used, StandardCharsets.US_ASCII).trim();
                    }
                    if (!expected.matches("[0-9a-f]{64}"))
                        throw new IllegalStateException("Invalid bundled game checksum");
                    SharedPreferences prefs = getSharedPreferences("ktstudio-bundle", MODE_PRIVATE);
                    PluginRecord existing = PluginStore.find(this, GAME);
                    if (existing != null && existing.isLaunchable()
                            && expected.equals(prefs.getString("sha256", ""))) return;

                    File temporary = File.createTempFile("ktstudio-", ".apk", getCacheDir());
                    try {
                        MessageDigest sha256 = MessageDigest.getInstance("SHA-256");
                        long total = 0;
                        try (InputStream in = getAssets().open(ASSET);
                             FileOutputStream out = new FileOutputStream(temporary)) {
                            byte[] buf = new byte[65536];
                            int n;
                            while ((n = in.read(buf)) != -1) {
                                total += n;
                                if (total > MAX_GAME_BYTES) throw new IllegalStateException("Guest APK too large");
                                out.write(buf, 0, n);
                                sha256.update(buf, 0, n);
                            }
                            out.getFD().sync();
                        }
                        if (!hex(sha256.digest()).equals(expected))
                            throw new IllegalStateException("Bundled Minecraft APK checksum mismatch");

                        PluginRecord installed = PluginStore.importApk(this, Uri.fromFile(temporary));
                        if (!GAME.equals(installed.packageName) || !installed.isLaunchable())
                            throw new IllegalStateException("Cannot prepare Minecraft: " + installed.status());
                        // Upstream import preserves the existing plugin data/ directory on replacement.
                        if (!prefs.edit().putString("sha256", expected).commit())
                            throw new IllegalStateException("Cannot save first-run completion marker");
                    } finally {
                        // Only the temporary copy is removed, never plugin data or saved worlds.
                        if (temporary.exists()) temporary.delete();
                    }
                }
            }

            private static String hex(byte[] bytes) {
                StringBuilder text = new StringBuilder(bytes.length * 2);
                for (byte b : bytes) {
                    int v = b & 255;
                    text.append("0123456789abcdef".charAt(v >>> 4));
                    text.append("0123456789abcdef".charAt(v & 15));
                }
                return text.toString();
            }

            private void showFailure(Throwable error) {
                if (isFinishing() || isDestroyed()) return;
                final String detail = "Minecraft 1.1.5 KTstudio — экспериментальный ARM64-запуск\n\n"
                        + error.toString()
                        + "\n\nЭто ошибка подготовки/совместимости, а не подтверждение запуска игры.";
                try { Diagnostics.report(this, "KTstudio bootstrap", error, false); }
                catch (Throwable ignored) { /* Keep the original error visible. */ }
                new AlertDialog.Builder(this)
                        .setTitle("Не удалось запустить игру")
                        .setMessage(detail)
                        .setCancelable(false)
                        .setPositiveButton("Скопировать ошибку", (dialog, which) -> {
                            ClipboardManager clipboard = (ClipboardManager)
                                    getSystemService(Context.CLIPBOARD_SERVICE);
                            if (clipboard != null) clipboard.setPrimaryClip(ClipData.newPlainText("KTstudio", detail));
                            finish();
                        })
                        .setNegativeButton("Закрыть", (dialog, which) -> finish())
                        .show();
            }
        }
        KT_JAVA
        cat > "$RUNNER_TEMP/patch_host.py" <<'KT_PYTHON'
        #!/usr/bin/env python3
        """Patch only the host launcher; no Minecraft bytes, credentials, or saves are used."""
        from pathlib import Path
        import base64
        import shutil
        import sys
        import xml.etree.ElementTree as ET

        root = Path(sys.argv[1]).resolve()
        source = Path(sys.argv[2]).resolve()
        base = root / 'android/launcher/app'
        android_ns = 'http://schemas.android.com/apk/res/android'
        tools_ns = 'http://schemas.android.com/tools'
        ET.register_namespace('android', android_ns)
        ET.register_namespace('tools', tools_ns)
        a = '{' + android_ns + '}'
        manifest = base / 'src/main/AndroidManifest.xml'
        tree = ET.parse(manifest)
        app = tree.getroot().find('application')
        if app is None:
            raise RuntimeError('Upstream application element is missing')
        app.set(a + 'label', 'Minecraft 1.1.5 KTstudio')
        app.set(a + 'icon', '@drawable/kt_icon')
        app.set(a + 'allowBackup', 'false')
        app.set(a + 'extractNativeLibs', 'true')
        app.set(a + 'usesCleartextTraffic', 'true')
        # No exported emulator library/file importer or public guest entry points.
        for item in app.findall('activity'):
            name = item.get(a + 'name', '')
            if name in ('.LibraryActivity', '.GuestLaunchActivity', '.PluginSwitchActivity'):
                item.set(a + 'exported', 'false')
            for intent in list(item.findall('intent-filter')):
                if any(cat.get(a+'name') == 'android.intent.category.LAUNCHER'
                       for cat in intent.findall('category')):
                    item.remove(intent)
            affinity = item.get(a + 'taskAffinity')
            if affinity:
                item.set(a+'taskAffinity', affinity.replace('com.zettabridge.launcher', 'com.ktstudio.mcpe115'))
        entry = ET.SubElement(app, 'activity', {
            a+'name': '.KtStudioActivity',
            a+'exported': 'true',
            a+'screenOrientation': 'sensorLandscape',
            a+'configChanges': 'orientation|screenSize|keyboardHidden',
            a+'theme': '@android:style/Theme.Material.NoActionBar',
        })
        intent = ET.SubElement(entry, 'intent-filter')
        ET.SubElement(intent, 'action', {a+'name': 'android.intent.action.MAIN'})
        ET.SubElement(intent, 'category', {a+'name': 'android.intent.category.LAUNCHER'})
        ET.indent(tree, space='    ')
        tree.write(manifest, encoding='utf-8', xml_declaration=True)

        gradle = base / 'build.gradle.kts'
        s = gradle.read_text()
        replacements = {
            'applicationId = "com.zettabridge.launcher"': 'applicationId = "com.ktstudio.mcpe115"',
            'minSdk = 26': 'minSdk = 29',
            'versionCode = 1': 'versionCode = 1151001',
            'versionName = "0.1.0"': 'versionName = "1.1.5-KTstudio-arm64-test1"',
        }
        for old, new in replacements.items():
            if s.count(old) != 1:
                raise RuntimeError('Unexpected upstream Gradle configuration: ' + old)
            s = s.replace(old, new, 1)
        s = s.replace('    compileOptions {',
                      '    packaging { jniLibs { useLegacyPackaging = true } }\n    compileOptions {', 1)
        gradle.write_text(s)

        java_dir = base / 'src/main/java/com/zettabridge/launcher'
        shutil.copyfile(source, java_dir/'KtStudioActivity.java')
        res = base / 'src/main/res/drawable-nodpi'
        res.mkdir(parents=True, exist_ok=True)
        # Placeholder only. Replace this resource with the owner's existing game icon locally.
        (res/'kt_icon.png').write_bytes(base64.b64decode(
            'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR4nGPo6en5DwAF8AKkTfvRhgAAAABJRU5ErkJggg=='))
        assets = base / 'src/main/assets'
        notices = assets / 'ktstudio/legal'
        notices.mkdir(parents=True, exist_ok=True)
        shutil.copyfile(root/'LICENSE', notices/'ZettaBridge-LICENSE.txt')
        shutil.copyfile(root/'third_party/README.md', notices/'THIRD-PARTY.txt')
        for path in sorted((root/'third_party').rglob('*')):
            if path.is_file() and any(k in path.name.lower() for k in ('license', 'copying', 'notice')):
                destination = notices / 'third_party' / path.relative_to(root/'third_party')
                destination.parent.mkdir(parents=True, exist_ok=True)
                shutil.copyfile(path, destination)
        (notices/'KTstudio-CHANGES.txt').write_text(
            'Personal experimental launcher using ZettaBridge; ZettaBridge is by ZailoxTT.\n'
            'Changes: one embedded-game bootstrap, separate application ID, launcher manifest, '\
            'icon placeholder, compressed host libraries. Translator core remains unchanged.\n'
            'No Minecraft game data is contained in the cloud build. Guest is embedded locally.\n'
            'Not an official Mojang/Microsoft or ZettaBridge release. Not a tested Minecraft port.\n'
            'ZettaBridge source and license: https://github.com/ZailoxTT/ZettaBridge\n'
            'Pinned source: d6066b9b9e61de27041ba6e1f3c499c080c9e2b7\n'
            'Do not sell or publish as a competing translation product. Read upstream licenses.\n')
        print('Single-game host patch applied; no guest game embedded.')
        KT_PYTHON
        python3 "$RUNNER_TEMP/patch_host.py" "$PWD" "$RUNNER_TEMP/KtStudioActivity.java"
    - name: Compile the unsigned host APK
      run: |2

        set -euo pipefail
        cd "$GITHUB_WORKSPACE/zbsource/android/launcher"
        chmod +x gradlew
        ./gradlew --no-daemon --max-workers=2 assembleRelease
    - name: Check ARM64 output and prepare local packaging tools
      run: |2

        set -euo pipefail
        cd "$GITHUB_WORKSPACE"
        mkdir -p output/tools output/source output/legal
        cp zbsource/android/launcher/app/build/outputs/apk/release/app-release-unsigned.apk output/ktstudio-arm64-host-unsigned.apk
        cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" output/tools/apksigner.jar
        cp "$ANDROID_HOME/build-tools/35.0.0/NOTICE.txt" output/tools/Android-build-tools-NOTICE.txt
        cp "$RUNNER_TEMP/KtStudioActivity.java" "$RUNNER_TEMP/patch_host.py" output/source/
        cp zbsource/android/launcher/app/src/main/AndroidManifest.xml output/source/Host-AndroidManifest.xml
        cp zbsource/android/launcher/app/build.gradle.kts output/source/
        cp -r zbsource/android/launcher/app/src/main/assets/ktstudio/legal/. output/legal/
        curl --fail --location --retry 3 \
          https://github.com/iBotPeaches/Apktool/releases/download/v2.12.1/apktool_2.12.1.jar \
          -o output/tools/apktool.jar
        echo '66cf4524a4a45a7f56567d08b2c9b6ec237bcdd78cee69fd4a59c8a0243aeafa  output/tools/apktool.jar' | sha256sum -c
        curl --fail --location --retry 3 \
          https://raw.githubusercontent.com/iBotPeaches/Apktool/v2.12.1/LICENSE.md \
          -o output/tools/Apktool-LICENSE.txt
        python3 - <<'KT_VERIFY'
        import struct, zipfile
        from pathlib import Path
        p = Path('output/ktstudio-arm64-host-unsigned.apk')
        with zipfile.ZipFile(p) as z:
            assert z.testzip() is None, 'ZIP CRC error'
            names = z.namelist()
            assert 'assets/ktstudio/game.apk' not in names, 'Never publish the user game in CI'
            hosts = [n for n in names if n.startswith('lib/') and n.endswith('.so')]
            assert hosts and all(n.startswith('lib/arm64-v8a/') for n in hosts), hosts
            for n in hosts:
                data = z.read(n)
                assert data[:6] == b'\x7fELF\x02\x01', n
                assert struct.unpack_from('<H', data, 18)[0] == 183, n
                assert z.getinfo(n).compress_type == zipfile.ZIP_DEFLATED, n
            assert 'assets/zb-files.txt' in names and 'assets/zb-version.txt' in names
            assert 'assets/ktstudio/legal/ZettaBridge-LICENSE.txt' in names
            assert 'classes.dex' in names
        print('Structural checks passed. No Android install/gameplay test has run.')
        KT_VERIFY
        {
          echo "source=d6066b9b9e61de27041ba6e1f3c499c080c9e2b7"
          echo "ndk=$NDK"
          echo "run=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          echo "guest_apk_in_cloud=false"
          echo "android_device_test=false"
          java -version 2>&1
          cat "$NDK/source.properties"
        } > output/BUILD-INFO.txt
        cat > output/READ-ME-FIRST.txt <<'KT_README'
        This is NOT the final Minecraft APK. Do not try to install the unsigned host.
        The archive contains the ARM64 compatibility host and local packaging tools.
        The user's Minecraft APK, signing keys and saved worlds are not in this archive.
        Next: verify guest dependencies, audio/storage adaptation, embed the owned game
        as assets/ktstudio/game.apk and its SHA-256 as assets/ktstudio/game.sha256,
        replace the placeholder kt_icon.png with the user's existing icon, align/sign,
        then install and test on the actual ARM64-only Android phone.
        ZettaBridge is experimental and its upstream licences still apply.
        NativeActivity support is not a confirmation that Minecraft 1.1.5 works.
        KT_README
        (cd output && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
    - name: Upload host and local packaging tools (no Minecraft)
      uses: actions/upload-artifact@v4
      with:
        name: ktstudio-arm64-host
        path: output/
        if-no-files-found: error
        retention-days: 7
